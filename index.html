<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c96442">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="&#49324;&#51652;&#8594;&#50892;&#46300;">
<title>&#49324;&#51652; &#44544;&#51088; &#8594; &#50892;&#46300;</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<style>
:root{--bg:#faf9f5;--card:#fff;--text:#1f1e1d;--muted:#6b6a68;--line:#e5e2d9;--accent:#c96442;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2a2927;--text:#f2f0ea;--muted:#a8a69f;--line:#3d3b37;--accent:#d97757;--accent-t:#1f1e1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;margin:4px 0}
p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{flex:1;min-width:140px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:14px 12px;border-radius:12px;font-size:16px;font-weight:600;text-align:center;cursor:pointer;font-family:inherit}
.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button:disabled{opacity:.45}
.pick{position:relative;flex:1;min-width:140px}
.pick .btn{display:block;width:100%;min-width:0}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#preview{display:none;margin:14px 0 0;max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--line);object-fit:contain}
#status{margin:14px 0 8px;font-size:14px;color:var(--muted);min-height:20px}
textarea{width:100%;min-height:260px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;line-height:1.6;font-family:inherit;resize:vertical}
.tools{margin-top:10px}
.tools button{min-width:100px;padding:12px;font-size:15px}
</style>
</head>
<body>
<main>
  <h1>&#128247; &#49324;&#51652; &#44544;&#51088; &#8594; &#50892;&#46300;</h1>
  <p class="sub">&#47928;&#49436;&#47484; &#52524;&#50689;&#54616;&#47732; &#44544;&#51088;&#47484; &#48977;&#50500; &#54200;&#51665;&#54616;&#44256;, &#50892;&#46300; &#54028;&#51068;&#47196; &#51200;&#51109;&#54644;&#50836;.</p>
  <div class="row">
    <div class="pick"><div class="btn primary">&#52852;&#47700;&#46972;&#47196; &#52524;&#50689;</div><input id="cam" type="file" accept="image/*" capture="environment" aria-label="&#52852;&#47700;&#46972;&#47196; &#52524;&#50689;"></div>
    <div class="pick"><div class="btn">&#50536;&#48276;&#50640;&#49436; &#49440;&#53469;</div><input id="gal" type="file" accept="image/*" multiple aria-label="&#50536;&#48276;&#50640;&#49436; &#49440;&#53469;"></div>
  </div>
  <img id="preview" alt="&#49440;&#53469;&#54620; &#49324;&#51652; &#48120;&#47532;&#48372;&#44592;">
  <div id="status"></div>
  <textarea id="out" placeholder="&#52628;&#52636;&#46108; &#44544;&#51088;&#44032; &#50668;&#44592;&#50640; &#54364;&#49884;&#46076;&#50836;. &#51649;&#51217; &#49688;&#51221;&#54624; &#49688;&#46020; &#51080;&#50612;&#50836;."></textarea>
  <div class="row tools">
    <button id="copy">&#48373;&#49324;</button>
    <button id="clear">&#51648;&#50864;&#44592;</button>
    <button id="save" class="primary">Word&#47196; &#51200;&#51109;</button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const out = $('out'), statusEl = $('status'), preview = $('preview');
const setStatus = t => { statusEl.textContent = t; };
let busy = false, worker = null;

function shrink(file, max = 2000) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve({ blob: b, url }) : reject(new Error('\ubcc0\ud658 \uc2e4\ud328')), 'image/jpeg', 0.9);
    };
    img.onerror = () => reject(new Error('\uc774\ubbf8\uc9c0\ub97c \uc5f4 \uc218 \uc5c6\uc5b4\uc694'));
    img.src = url;
  });
}

async function getWorker() {
  if (worker) return worker;
  if (!window.Tesseract) throw new Error('\uc778\uc2dd \uc5d4\uc9c4\uc744 \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc5b4\uc694. \uc778\ud130\ub137 \uc5f0\uacb0\uc744 \ud655\uc778\ud558\uace0 \uc0c8\ub85c\uace0\uce68\ud574\uc8fc\uc138\uc694.');
  setStatus('\uae00\uc790 \uc778\uc2dd \uc5d4\uc9c4\uc744 \ubd88\ub7ec\uc624\ub294 \uc911\u2026 (\ucc98\uc74c \ud55c \ubc88\ub9cc \uac78\ub824\uc694)');
  worker = await Tesseract.createWorker('kor+eng', 1, {
    logger: m => {
      if (m.status === 'recognizing text') setStatus('\uae00\uc790\ub97c \uc77d\ub294 \uc911\u2026 ' + Math.round(m.progress * 100) + '%');
      else if (m.progress != null && m.progress < 1) setStatus('\uc5d4\uc9c4 \uc900\ube44 \uc911\u2026 ' + Math.round(m.progress * 100) + '%');
    }
  });
  return worker;
}

async function extract(files) {
  if (busy) return;
  busy = true;
  try {
    const w = await getWorker();
    for (const file of files) {
      setStatus('\uc0ac\uc9c4\uc744 \uc900\ube44\ud558\ub294 \uc911\u2026');
      const { blob, url } = await shrink(file);
      preview.src = url; preview.style.display = 'block';
      setStatus('\uae00\uc790\ub97c \uc77d\ub294 \uc911\u2026');
      const { data } = await w.recognize(blob);
      const prev = out.value ? out.value.replace(/\s+$/, '') + '\n\n' : '';
      out.value = prev + data.text.trim();
    }
    setStatus('\uc644\ub8cc! \ub0b4\uc6a9\uc744 \ud655\uc778\ud558\uace0 \uc218\uc815\ud55c \ub4a4 \uc800\uc7a5\ud558\uc138\uc694.');
  } catch (e) {
    setStatus('\uae00\uc790\ub97c \uc77d\uc9c0 \ubabb\ud588\uc5b4\uc694: ' + ((e && e.message) || '\uc54c \uc218 \uc5c6\ub294 \uc624\ub958'));
  }
  busy = false;
}

['cam', 'gal'].forEach(id => $(id).addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length) { setStatus('\uc0ac\uc9c4\uc744 \ubc1b\uc558\uc5b4\uc694\u2026'); extract(files); }
}));

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(out.value); setStatus('\ubcf5\uc0ac\ud588\uc5b4\uc694.'); }
  catch (e) { out.select(); setStatus('\ud14d\uc2a4\ud2b8\ub97c \uc120\ud0dd\ud588\uc5b4\uc694. \uc9c1\uc811 \ubcf5\uc0ac\ud574\uc8fc\uc138\uc694.'); }
};
$('clear').onclick = () => { out.value = ''; preview.style.display = 'none'; setStatus(''); };

$('save').onclick = async () => {
  const text = out.value.trim();
  if (!text) { setStatus('\uc800\uc7a5\ud560 \ub0b4\uc6a9\uc774 \uc5c6\uc5b4\uc694. \uba3c\uc800 \uc0ac\uc9c4\uc744 \uc62c\ub824\uc8fc\uc138\uc694.'); return; }
  if (!window.docx) { setStatus('\uc6cc\ub4dc \ubcc0\ud658 \ub3c4\uad6c\ub97c \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc5b4\uc694. \uc0c8\ub85c\uace0\uce68\ud574\uc8fc\uc138\uc694.'); return; }
  try {
    const { Document, Packer, Paragraph, TextRun } = window.docx;
    const paragraphs = text.split(/\r?\n/).map(line =>
      new Paragraph({ spacing: { after: 120, line: 320 }, children: [new TextRun({ text: line, font: 'Malgun Gothic', size: 22 })] }));
    const blob = await Packer.toBlob(new Document({ sections: [{ children: paragraphs }] }));
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `\uc0ac\uc9c4\uae00\uc790_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.docx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setStatus('\uc6cc\ub4dc \ud30c\uc77c\uc744 \uc800\uc7a5\ud588\uc5b4\uc694.');
  } catch (e) {
    setStatus('\uc800\uc7a5\ud558\uc9c0 \ubabb\ud588\uc5b4\uc694: ' + ((e && e.message) || '\uc54c \uc218 \uc5c6\ub294 \uc624\ub958'));
  }
};
</script>
</body>
</html>
